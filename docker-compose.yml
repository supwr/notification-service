services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: notification-service-zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - notification-service-service-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: notification-service-kafka-ui
    restart: always
    ports:
      - "8081:8080"
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - notification-service-service-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: notification-service-kafka
    restart: always
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    networks:
      - notification-service-service-net

  kafka-init-topics:
    image: confluentinc/cp-kafka:7.5.0
    container_name: notification-service-kafka-init-topics
    depends_on:
      - kafka
    command: >
      bash -c "
        echo 'Waiting Kafka to be ready...'
        cub kafka-ready -b kafka:29092 1 30
        echo 'Creating topics...'
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic scheduling.appointment.notification --partitions 1 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic scheduling.appointment.notification-retry --partitions 1 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic scheduling.appointment.notification-dlq --partitions 1 --replication-factor 1
        echo 'Topics created successfully.'
      "
    networks:
      - notification-service-service-net

  notification-service-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notification-service-worker
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: worker
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_CONSUMER_GROUP_ID: notification-service
    depends_on:
      - kafka-init-topics
    networks:
      - notification-service-service-net

networks:
  notification-service-service-net:
    driver: bridge